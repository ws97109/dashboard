<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案進度追蹤系統</title>

    <link rel="stylesheet" href="fonts/fonts.css">

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/tooltip.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="tooltip" class="tooltip"></div>
    <div class="aurora" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div id="_layout_header"></div>

    <div class="dash-wrap">
        <!-- 導言 -->
        <div class="dash-intro">
            <div>
                <div class="dash-intro__title">專案進度總覽</div>
                <div class="dash-intro__sub">TAISHIN BANK · PROJECT DELIVERY OVERVIEW</div>
            </div>
            <div class="dash-intro__pills">
                <span class="pill">
                    <svg viewBox="0 0 24 24" fill="none" style="width:15px;height:15px"><rect x="3" y="4" width="18" height="17" rx="2.5" stroke="#b6c1de" stroke-width="1.6"/><path d="M3 9h18M8 2.5v4M16 2.5v4" stroke="#b6c1de" stroke-width="1.6" stroke-linecap="round"/></svg>
                    <span id="introPeriod">本季</span>
                </span>
                <span class="pill"><span class="dot"></span>即時更新</span>
            </div>
        </div>

        <!-- Hero：整體完成度 + 五階段進度流 -->
        <section class="hero">
            <div class="glass overall">
                <div class="card-label">
                    <svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#5fb2ff" stroke-width="1.6"/><path d="M12 7v5l3.5 2" stroke="#5fb2ff" stroke-width="1.6" stroke-linecap="round"/></svg>
                    整體完成度
                </div>
                <div class="ring-wrap">
                    <div class="ring-stage">
                        <div class="ring-glow"></div>
                        <svg class="ring-svg" viewBox="0 0 336 336">
                            <defs>
                                <linearGradient id="gOverall" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#4fe3c4"/><stop offset="36%" stop-color="#5fb2ff"/>
                                    <stop offset="70%" stop-color="#a98bff"/><stop offset="100%" stop-color="#ff6f8d"/>
                                </linearGradient>
                                <filter id="softGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                            </defs>
                            <circle cx="168" cy="168" r="132" stroke="rgba(255,255,255,.07)" stroke-width="18" fill="none"/>
                            <circle id="overallArc" cx="168" cy="168" r="132" stroke="url(#gOverall)" stroke-width="18" fill="none"
                                    stroke-linecap="round" stroke-dasharray="829.4" stroke-dashoffset="829.4" filter="url(#softGlow)"/>
                            <circle cx="168" cy="168" r="103" stroke="rgba(255,255,255,.05)" stroke-width="2" fill="none" stroke-dasharray="2 8"/>
                        </svg>
                        <div class="ring-center">
                            <div><span class="big" id="overallPercentage">0</span><span class="pct">%</span></div>
                            <div class="cap">OVERALL PROGRESS</div>
                            <div class="cap2">各階段平均完成度</div>
                        </div>
                    </div>
                </div>
                <div class="overall-foot" id="overallFoot"></div>
            </div>

            <div class="glass flow">
                <div class="flow-head">
                    <div class="card-label">
                        <svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 12h15M14 6l6 6-6 6" stroke="#a98bff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        階段進度流
                    </div>
                    <div class="legend">
                        <span><i style="background:#34d399"></i>領先平均</span>
                        <span><i style="background:#60a5fa"></i>接近平均</span>
                        <span><i style="background:#f87171"></i>落後平均</span>
                    </div>
                </div>
                <div class="flow-track" id="flowTrack">
                    <div class="connector"><div class="fill" id="connectorFill"></div><div class="head" id="connectorHead"></div></div>
                </div>
            </div>
        </section>

        <!-- 各階段卡片 -->
        <section class="cats" id="cats"></section>

        <!-- 實際進度 vs 整體平均 -->
        <section class="glass compare">
            <div class="compare-head">
                <div class="card-label">
                    <svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="#4fe3c4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    實際進度 vs 整體平均
                </div>
                <div class="compare-sub">白色標線為<b>整體平均</b>　·　彩條超過標線代表領先、未及代表落後</div>
            </div>
            <div class="crows" id="crows"></div>
        </section>

        <div class="foot-note" id="footNote"></div>
    </div>

    <div id="_layout_footer"></div>

    <script>window._layoutConfig = { root: '' };</script>
    <script src="js/authToken.js"></script>
    <script>
      (function() { if (!window.getAuthToken()) { window.location.replace('login.html'); } })();
    </script>
    <script src="js/layout.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dataLoader.js"></script>
    <script src="js/indexPage.js"></script>
</body>
</html>
